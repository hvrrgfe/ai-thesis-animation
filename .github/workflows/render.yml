name: Render Video

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Remotion Chrome
        run: npx remotion browser ensure

      - name: Render video
        run: npx remotion render src/Root.tsx MainComp out/video.mp4 --codec=h264 --crf=18 --concurrency=4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
          retention-days: 30
